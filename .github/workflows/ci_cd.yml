name: Pipeline CI/CD - TA_EX_7

# Define el disparador: El pipeline se ejecuta solo cuando hay un 'push' en la rama develop.
on:
  push:
    branches:
      - develop

jobs:
  build_and_test:
    name: Build & Test con Maven
    # Elige el sistema operativo para ejecutar las tareas (servidor virtual de GitHub)
    runs-on: ubuntu-latest

    steps:
      # 1. Obtiene el código del repositorio
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      # 2. Configura el entorno Java 17
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          # Usa el caché de Maven para acelerar descargas de dependencias
          cache: 'maven'

      # ESCENARIO 1: Build (Compilación)
      - name: 1. Compilación
        # Ejecuta Maven hasta la fase 'compile'. -DskipTests asegura que no se ejecuten las pruebas aquí.
        run: mvn clean compile -DskipTests

      # ESCENARIO 2: Test (Ejecución de Pruebas Unitarias)
      - name: 2. Ejecución de Pruebas Unitarias
        # Ejecuta la fase 'test', que activa el maven-surefire-plugin para correr JUnit 5
        run: mvn test