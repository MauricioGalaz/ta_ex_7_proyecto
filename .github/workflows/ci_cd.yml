name: Pipeline CI/CD - TA_EX_7

on:
  push:
    branches:
      - develop

jobs:
  # JOB 1: CI (Build y Test)
  build_and_test:
    name: 1. Build & Test con Maven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'maven'

      - name: 1. Compilación
        run: mvn clean compile -DskipTests

      - name: 2. Ejecución de Pruebas Unitarias
        run: mvn test

  # -----------------------------------------------------------------
  # JOB 2: CD (Acceptance Test Gate) - Debe estar al mismo nivel que build_and_test
  acceptance_tests:
    name: 3. Acceptance Test Gate
    # Dependencia: SOLO se ejecuta si el Job 1 fue exitoso
    needs: build_and_test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'maven'

      - name: Ejecutar Pruebas de Aceptación (Simulación Selenium)
        run: mvn verify -Pacceptance

  # -----------------------------------------------------------------
  # JOB 3: CD (Despliegue) - Debe estar al mismo nivel que build_and_test
  deploy_staging:
    name: 4. Despliegue a Staging
    # Dependencia: SOLO se ejecuta si el Job 2 fue exitoso
    needs: acceptance_tests
    environment: Staging
    runs-on: ubuntu-latest

    steps:
      - name: Simular Despliegue en Staging
        run: |
          echo "Despliegue exitoso de la versión $GITHUB_SHA a ambiente Staging."
          echo "Simulando comandos de despliegue..."